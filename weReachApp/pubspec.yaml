name: wereach
description: "A premium location-alert app to prevent missing your stop while traveling."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Maps — Mapbox
  mapbox_maps_flutter: ^2.2.0

  # Location
  geolocator: ^12.0.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Audio
  just_audio: ^0.9.40

  # Local DB
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Networking
  dio: ^5.7.0

  # Vibration
  vibration: ^2.0.0

  # Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.mp3
    - assets/config.json
